name: devopshub

services:
  postgres:
    image: postgres:16
    container_name: devopshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopshub -d devopshub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: devopshub-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://devopshub:${POSTGRES_PASSWORD}@postgres:5432/devopshub"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: devopshub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data:
