apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  sources:
    # Prometheus 官方 Helm Chart
    - repoURL: ghcr.io/prometheus-community/charts
      chart: prometheus
      targetRevision: 29.47.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/k8s/monitoring/prometheus-values.yaml

    # DevOpsHub 自己维护的配置文件
    - repoURL: https://github.com/asamuratatsuya/DevOpsHub.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
