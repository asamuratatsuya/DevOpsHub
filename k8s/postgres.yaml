# PostgreSQL 无头 Service，供 StatefulSet 使用
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: devopshub
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# PostgreSQL 普通 Service，供 Backend 访问
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devopshub
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devopshub
spec:
  serviceName: postgres-headless
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 60

      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          args:
            - "-c"
            - "max_connections=30"
            - "-c"
            - "shared_buffers=96MB"

          env:
            - name: POSTGRES_DB
              value: devopshub

            - name: POSTGRES_USER
              value: devopshub

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devopshub-db
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devopshub
                - -d
                - devopshub
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devopshub
                - -d
                - devopshub
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devopshub
                - -d
                - devopshub
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
