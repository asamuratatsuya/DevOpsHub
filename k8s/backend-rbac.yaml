
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devopshub-backend
  namespace: devopshub
automountServiceAccountToken: true

---
# 集群范围：只读权限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devopshub-backend-readonly
rules:
  # 节点查询
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # 全集群 Pod 查询
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # 全集群 Deployment 查询
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devopshub-backend-readonly
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devopshub-backend-readonly

---
# devopshub 命名空间：管理权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devopshub-backend-manager
  namespace: devopshub
rules:
  # Pod 删除
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # Pod 日志读取
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Deployment 重启等操作
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]

  # Deployment 副本数调整
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devopshub-backend-manager
  namespace: devopshub
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devopshub-backend-manager
