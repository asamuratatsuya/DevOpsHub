apiVersion: v1
kind: ServiceAccount
metadata:
  name: devopshub-backend
  namespace: devopshub
automountServiceAccountToken: true

---
# 集群级权限：全命名空间查询 + 工作负载管理
# 注意：本文件里 "pods" 只在这一个 ClusterRole 中出现，避免同作用域内
# 同名资源被多条规则拆分而导致读权限失效。Pod 删除由下方 Role 叠加。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devopshub-backend
rules:
  # 节点查询（只读）
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # 全命名空间 Pod 查询（只读；删除权限另见 Role）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # 全命名空间容器日志
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # 全命名空间 Deployment：查询 + patch
  # patch 用于扩缩容与滚动重启（写 restartedAt 注解）
  # 明确不给 create / delete / update
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]

  # 全命名空间 Deployment 副本数子资源
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devopshub-backend
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devopshub-backend

---
# 命名空间级：Pod 删除权限仅在 devopshub 内开放。
# 删除其他命名空间的 Pod 会重建 kube-system 组件，风险不对等，故不放开。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devopshub-backend-pod-deleter
  namespace: devopshub
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devopshub-backend-pod-deleter
  namespace: devopshub
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devopshub-backend-pod-deleter