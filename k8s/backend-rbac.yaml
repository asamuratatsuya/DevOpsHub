apiVersion: v1
kind: ServiceAccount
metadata:
  name: devopshub-backend
  namespace: devopshub
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devopshub-backend
rules:
  # 节点：只读（列表、详情）
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

  # Pod：读 + 删除
  # 删除 Pod 后由上层 Deployment 的 ReplicaSet 自动补新 Pod，等效"重启"
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete

  # Pod 日志：只读
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  # Deployment：读 + patch
  # patch 用于给 spec.template.metadata.annotations 打
  # kubectl.kubernetes.io/restartedAt 时间戳，触发滚动重启
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch

  # Deployment 的 scale 子资源：读 + patch，用于调整副本数
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devopshub-backend
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devopshub-backend