apiVersion: v1
kind: ServiceAccount
metadata:
  name: devopshub-backend
  namespace: devopshub
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devopshub-backend-readonly
rules:
  # 读取集群节点
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch

  # 读取集群 Pod
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devopshub-backend-readonly
subjects:
  - kind: ServiceAccount
    name: devopshub-backend
    namespace: devopshub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devopshub-backend-readonly
